<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8f5">
  <meta name="description" content="高齢者向け見守り・生活支援アプリの試作版">
  <title>毎日のくらし</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand">毎日のくらし</div>
      <button id="installButton" class="install-button" type="button" hidden>アプリをインストール</button>
    </header>

    <section class="dashboard" aria-label="通常画面">
      <article class="widget date-widget" aria-label="日時">
        <div id="todayDate" class="date-text">11月9日（月）</div>
        <div id="currentTime" class="time-text">00:29</div>
      </article>

      <article class="widget schedule-widget" id="scheduleWidget">
  <div class="widget-heading">
    <span class="symbol" aria-hidden="true">▦</span>
    <h2 id="scheduleHeading">今日の予定</h2>
  </div>
  <div class="schedule-list" id="scheduleList"></div>
  <button class="schedule-manage-button" id="scheduleManageButton" type="button">
    予定を管理
  </button>
</article>

      <article class="widget medication-widget">
        <div class="symbol" aria-hidden="true">＋</div>
        <h2>お薬</h2>
        <p class="main-value">本人申告</p>
      </article>

      <article class="widget blood-widget">
        <div class="symbol" aria-hidden="true">♥</div>
        <h2>血圧</h2>
        <p class="main-value">128/76</p>
      </article>

      <article class="widget message-widget">
        <div class="message-heading">
          <div class="widget-heading"><span class="symbol" aria-hidden="true">✉</span><h2>家族からのメッセージ</h2></div>
          <span class="unread">未読 1</span>
        </div>
        <p class="message-text">今度の日曜日に会いに行くね！</p>
        <p class="message-meta">娘　15:30</p>
      </article>

      <article class="widget tips-widget">
        <div class="symbol" aria-hidden="true">☘</div>
        <h2>プチ健康情報</h2>
        <p>水分補給を忘れずに</p>
      </article>

      <article class="widget advice-widget">
        <div class="symbol" aria-hidden="true">☀</div>
        <h2>今日のアドバイス</h2>
        <p>涼しい場所で過ごそう</p>
      </article>
    </section>
    <dialog id="scheduleDialog" class="schedule-dialog">
  <div class="dialog-header">
    <h2>予定の確認・管理</h2>
    <button type="button" id="closeScheduleDialog">閉じる</button>
  </div>

  <div id="scheduleDialogContent"></div>

  <div class="schedule-settings">
    <h3>予定の切替時刻</h3>
    <label>
      明日の予定に切り替える時刻
      <input type="time" id="switchTime" value="18:00">
    </label>
    <button type="button" id="saveSwitchTime">時刻を保存</button>
  </div>

  <hr>

  <h3 id="scheduleFormHeading">予定を追加</h3>
  <form id="scheduleForm">
    <input type="hidden" id="scheduleId">

    <label>日付
      <input type="date" id="scheduleDate" required>
    </label>

    <label>時刻
      <input type="time" id="scheduleTime" required>
    </label>

    <label>予定名
      <input type="text" id="scheduleTitle" maxlength="40" required>
    </label>

    <label>詳細
      <textarea id="scheduleDetails" rows="3"></textarea>
    </label>

    <button type="submit">保存する</button>
    <button type="button" id="cancelScheduleEdit">入力をクリア</button>
  </form>
</dialog>
    <footer class="app-footer">毎日を、安心して自分らしく。</footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
